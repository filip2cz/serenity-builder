name: Build SerenityOS QEMU Image

on:
  # Trigger the workflow manually from the GitHub UI
  workflow_dispatch:
  # Trigger the workflow on push events to the main or master branch
  push:
    branches:
      - main
      - master

permissions:
  # Grant write permissions to the token to allow creating releases
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SerenityOS repository
        uses: actions/checkout@v4
        with:
          repository: SerenityOS/serenity
          fetch-depth: 1

      - name: Install Dependencies
        # Added grub-pc-bin, grub-common, mtools, parted and xorriso for building the bootable partition
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libmpfr-dev libmpc-dev libgmp-dev e2fsprogs ninja-build qemu-system-gui qemu-system-x86 qemu-utils ccache rsync unzip texinfo libssl-dev zlib1g-dev fuse2fs gcc-14 g++-14 grub-pc-bin grub-common mtools parted xorriso
        
      - name: Set environment variables
        # Force the build system to use GCC 14 for C++26 support
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Build Bootable GRUB Image
        # Build the grub-image target instead of limine because the upstream limine script fails
        run: |
          ./Meta/serenity.sh build x86_64 GNU
          ninja -C Build/x86_64 grub-image

      - name: Get current date
        id: date
        # Generate the current date (YYYY-MM-DD) to use as the release name and tag
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Convert and Compress Images
        # The grub-image target creates a file named grub_disk_image
        run: |
          cd Build/x86_64/
          qemu-img convert -f raw -O qcow2 grub_disk_image serenity-image.qcow2
          zip -r serenity-raw-image-${{ env.DATE }}.zip grub_disk_image
          zip -r serenity-qcow2-image-${{ env.DATE }}.zip serenity-image.qcow2
          
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DATE }}
          name: ${{ env.DATE }}
          files: |
            Build/x86_64/serenity-raw-image-${{ env.DATE }}.zip
            Build/x86_64/serenity-qcow2-image-${{ env.DATE }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}