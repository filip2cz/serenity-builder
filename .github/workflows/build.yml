name: Build SerenityOS QEMU Image

on:
  # Trigger the workflow manually from the GitHub UI
  workflow_dispatch:
  # Trigger the workflow on push events to the main or master branch
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SerenityOS repository
        uses: actions/checkout@v4
        with:
          # Force checking out the SerenityOS repository instead of the current one
          repository: SerenityOS/serenity
          # Fetch only the latest commit to speed up the checkout process
          fetch-depth: 1

      - name: Install Dependencies
        # Install all required packages as described in BuildInstructions.md
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libmpfr-dev libmpc-dev libgmp-dev e2fsprogs ninja-build qemu-system-gui qemu-system-x86 qemu-utils ccache rsync unzip texinfo libssl-dev zlib1g-dev fuse2fs gcc-14 g++-14
        
      - name: Set environment variables
        # Force the build system to use GCC 14 for C++26 support
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Build QEMU Image
        # Build the toolchain and the OS disk image for x86_64 architecture using GNU
        run: |
          ./Meta/serenity.sh image x86_64 GNU

      - name: Get current date
        id: date
        # Generate the current date (YYYY-MM-DD) to use as the release name and tag
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Compress QEMU Image
        # Compress the raw disk image into a zip archive for the release
        run: |
          cd Build/x86_64/
          zip -r serenity-qemu-image-${{ env.DATE }}.zip _disk_image
          
      - name: Create Release and Upload
        # Create a GitHub Release and upload the generated zip file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DATE }}
          name: ${{ env.DATE }}
          files: Build/x86_64/serenity-qemu-image-${{ env.DATE }}.zip
        env:
          # Provide the token for authentication to create the release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}